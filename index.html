<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBR SYSTEM - FUTURE EDITION</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    
    body { 
      background: #030308; 
      color: #fff; 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px;
      overflow-x: hidden;
    }

    /* خلفية نيون مستقبلية متحركة */
    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: #00f2fe;
      filter: blur(150px);
      border-radius: 50%;
      top: 10%;
      left: 10%;
      z-index: -1;
      opacity: 0.5;
    }
    body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: #7928ca;
      filter: blur(150px);
      border-radius: 50%;
      bottom: 10%;
      right: 10%;
      z-index: -1;
      opacity: 0.5;
    }

    /* كارت النظام المستقبلي */
    .card { 
      background: rgba(10, 10, 18, 0.85); 
      backdrop-filter: blur(12px);
      width: 100%; 
      max-width: 410px; 
      padding: 35px 25px; 
      border-radius: 24px; 
      border: 1px solid rgba(0, 242, 254, 0.3); 
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.15), inset 0 0 15px rgba(121, 40, 202, 0.2); 
      text-align: center; 
    }

    /* إطار الصورة المستقبلي */
    .avatar-container {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #00f2fe;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
    }

    /* العناوين والتأثيرات */
    h1 { 
      font-size: 24px; 
      font-weight: 900; 
      letter-spacing: 2px; 
      background: linear-gradient(90deg, #00f2fe, #4facfe, #00f2fe);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glowText 3s linear infinite;
    }

    @keyframes glowText {
      0% { background-position: 0%; }
      100% { background-position: 200%; }
    }

    .subtitle { 
      font-size: 11px; 
      color: #00f2fe; 
      margin-bottom: 25px; 
      letter-spacing: 3px; 
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* أزرار النيون المستقبلية */
    .link-card { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      background: rgba(255, 255, 255, 0.03); 
      border: 1px solid rgba(0, 242, 254, 0.15); 
      padding: 16px 20px; 
      border-radius: 14px; 
      color: #fff; 
      text-decoration: none; 
      margin-bottom: 14px; 
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      position: relative;
      overflow: hidden;
    }

    .link-card:hover { 
      background: rgba(0, 242, 254, 0.1); 
      border-color: #00f2fe; 
      transform: translateY(-3px) scale(1.02); 
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); 
    }

    .link-card i.main-icon { 
      font-size: 20px; 
      color: #00f2fe; 
      transition: 0.3s;
    }

    .link-card:hover i.main-icon {
      color: #fff;
      transform: rotate(-10deg) scale(1.2);
    }

    .link-card span { 
      font-weight: 700; 
      font-size: 15px; 
      letter-spacing: 1px;
    }

    .link-card i.arrow {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      transition: 0.3s;
    }

    .link-card:hover i.arrow {
      color: #00f2fe;
      transform: translateX(-5px);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- حاوية الصورة الشخصية -->
    <div class="avatar-container">
      <!-- استبدل رابط الصورة برابط صورتك إذا أردت -->
      <img "https://ibb.co/PsKsLn4Q
    </div>

    <h1>OBR SYSTEM</h1>
    <p class="subtitle">v2.0 // Cyber Node</p>
    
    <a href="#" class="link-card">
      <i class="fab fa-instagram main-icon"></i>
      <span>INSTAGRAM</span>
      <i class="fas fa-arrow-left arrow"></i>
    </a>

    <a href="#" class="link-card">
      <i class="fab fa-whatsapp main-icon"></i>
      <span>WHATSAPP</span>
      <i class="fas fa-arrow-left arrow"></i>
    </a>

    <a href="#" class="link-card">
      <i class="fas fa-gamepad main-icon"></i>
      <span>FREE FIRE STORE</span>
      <i class="fas fa-arrow-left arrow"></i>
    </a>

    <a href="#" class="link-card">
      <i class="fab fa-tiktok main-icon"></i>
      <span>TIKTOK</span>
      <i class="fas fa-arrow-left arrow"></i>
    </a>
  </div>

</body>
</html>
